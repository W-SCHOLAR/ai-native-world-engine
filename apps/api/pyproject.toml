[project]
name = "ai-native-world-api"
version = "0.1.0"
description = "Product HTTP and persistence boundary for AI Native World Engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "weitao" }]
dependencies = [
  "ai-native-world-engine==0.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_native_world_api"]

[tool.uv.sources]
ai-native-world-engine = { path = "../..", editable = true }
